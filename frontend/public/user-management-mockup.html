<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management - re:memo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-50">
  <div class="max-w-4xl mx-auto p-6">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-3xl font-bold text-gray-900">User Management</h1>
        <p class="text-gray-600 mt-1">Manage system users and permissions</p>
      </div>
      <button class="inline-flex items-center px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 font-medium">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <line x1="19" x2="19" y1="8" y2="14"></line>
          <line x1="22" x2="16" y1="11" y2="11"></line>
        </svg>
        Add User
      </button>
    </div>

    <!-- Users List -->
    <div class="space-y-3">
      <!-- Admin User -->
      <div class="bg-white rounded-lg border-2 border-gray-200 shadow-sm">
        <div class="p-4">
          <div class="flex items-center justify-between">
            <div class="flex-1">
              <div class="flex items-center gap-3">
                <h3 class="text-lg font-semibold text-gray-900">admin</h3>
                <span class="px-2 py-1 text-xs font-medium bg-blue-100 text-blue-600 rounded-md">Admin</span>
                <span class="px-2 py-1 text-xs font-medium bg-blue-50 text-blue-500 rounded-md">You</span>
              </div>
              <p class="text-sm text-gray-600 mt-1">User ID: 0</p>
            </div>
            <div class="flex gap-2">
              <button class="inline-flex items-center px-3 py-1.5 border-2 border-gray-200 rounded-lg hover:bg-gray-50 text-sm font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-1">
                  <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Reset Password
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Regular User 1 -->
      <div class="bg-white rounded-lg border-2 border-gray-200 shadow-sm">
        <div class="p-4">
          <div class="flex items-center justify-between">
            <div class="flex-1">
              <div class="flex items-center gap-3">
                <h3 class="text-lg font-semibold text-gray-900">john_doe</h3>
              </div>
              <p class="text-sm text-gray-600 mt-1">User ID: 1</p>
            </div>
            <div class="flex gap-2">
              <button class="inline-flex items-center px-3 py-1.5 border-2 border-gray-200 rounded-lg hover:bg-gray-50 text-sm font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-1">
                  <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Reset Password
              </button>
              <button class="inline-flex items-center px-3 py-1.5 border-2 border-red-200 rounded-lg hover:bg-red-50 text-red-600 text-sm font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-1">
                  <path d="M3 6h18"></path>
                  <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                  <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                </svg>
                Delete
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Regular User 2 -->
      <div class="bg-white rounded-lg border-2 border-gray-200 shadow-sm">
        <div class="p-4">
          <div class="flex items-center justify-between">
            <div class="flex-1">
              <div class="flex items-center gap-3">
                <h3 class="text-lg font-semibold text-gray-900">jane_smith</h3>
              </div>
              <p class="text-sm text-gray-600 mt-1">User ID: 2</p>
            </div>
            <div class="flex gap-2">
              <button class="inline-flex items-center px-3 py-1.5 border-2 border-gray-200 rounded-lg hover:bg-gray-50 text-sm font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-1">
                  <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Reset Password
              </button>
              <button class="inline-flex items-center px-3 py-1.5 border-2 border-red-200 rounded-lg hover:bg-red-50 text-red-600 text-sm font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-1">
                  <path d="M3 6h18"></path>
                  <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                  <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                </svg>
                Delete
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
