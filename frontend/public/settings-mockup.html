<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - re:memo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-50">
  <div class="max-w-4xl mx-auto p-6">
    <!-- Header -->
    <div class="mb-6">
      <h1 class="text-3xl font-bold text-gray-900">Settings</h1>
      <p class="text-gray-600 mt-1">Manage your account settings and preferences</p>
    </div>

    <!-- User Info Card -->
    <div class="bg-white rounded-lg border-2 border-gray-200 shadow-sm mb-6">
      <div class="p-6 border-b border-gray-200">
        <h2 class="text-xl font-semibold text-gray-900 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          Account Information
        </h2>
        <p class="text-sm text-gray-500 mt-1">Your account details</p>
      </div>
      <div class="p-6 space-y-4">
        <div>
          <label class="text-sm font-medium text-gray-600">Username</label>
          <p class="text-lg font-semibold text-gray-900 mt-1">john_doe</p>
        </div>
        <div>
          <label class="text-sm font-medium text-gray-600">User ID</label>
          <p class="text-lg font-semibold text-gray-900 mt-1">5</p>
        </div>
      </div>
    </div>

    <!-- Change Password Card -->
    <div class="bg-white rounded-lg border-2 border-gray-200 shadow-sm">
      <div class="p-6 border-b border-gray-200">
        <h2 class="text-xl font-semibold text-gray-900 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"></path>
            <path d="m21 2-9.6 9.6"></path>
            <circle cx="7.5" cy="15.5" r="5.5"></circle>
          </svg>
          Change Password
        </h2>
        <p class="text-sm text-gray-500 mt-1">Update your password to keep your account secure</p>
      </div>
      <div class="p-6">
        <form class="space-y-4">
          <div class="space-y-2">
            <label for="current-password" class="text-sm font-medium text-gray-900">Current Password</label>
            <input id="current-password" type="password" placeholder="Enter your current password" class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg focus:border-blue-500 focus:outline-none" />
          </div>
          <div class="space-y-2">
            <label for="new-password" class="text-sm font-medium text-gray-900">New Password</label>
            <input id="new-password" type="password" placeholder="Enter new password (min 8 characters)" class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg focus:border-blue-500 focus:outline-none" />
          </div>
          <div class="space-y-2">
            <label for="confirm-password" class="text-sm font-medium text-gray-900">Confirm New Password</label>
            <input id="confirm-password" type="password" placeholder="Confirm new password" class="w-full px-3 py-2 border-2 border-gray-200 rounded-lg focus:border-blue-500 focus:outline-none" />
          </div>
          <div class="pt-4">
            <button type="submit" class="inline-flex items-center px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 font-medium">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-2">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
              </svg>
              Change Password
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
